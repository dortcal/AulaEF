<style>
:root{--bg1:#0b1033;--bg2:#2a1466;--y:#ffd23f;--o:#ff9f1c;--p:#ff3d81;--c:#19d3ff;--g:#34e07f;--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.2);--fs:1;--c1:#7c3aed;--c2:#2563eb}
*{box-sizing:border-box}
html{font-size:calc(clamp(11px,min(1.05vw,1.85vh),26px)*var(--fs))}
body{margin:0;min-height:100vh;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(1200px 700px at 15% -10%,#4b2bb5 0,transparent 60%),radial-gradient(1000px 600px at 100% 110%,#0b6bd8 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow:hidden}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
main{overflow:auto;position:relative;padding:.5rem 1.6rem}
h1,h2,h3{margin:.2em 0;line-height:1.05}
.disp{font-family:Impact,"Arial Black","Haettenschweiler",sans-serif;letter-spacing:.02em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:.22rem solid var(--y);outline-offset:.15rem}
.noanim *,.noanim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){body:not(.forceanim) *{animation:none!important}}
/* cabecera y pie */
#hdr{display:flex;align-items:center;gap:1rem;padding:.4rem 1.2rem;background:rgba(5,8,30,.55);border-bottom:1px solid var(--bd);min-height:3.4rem}
#hdr .brand{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;cursor:pointer;background:none;border:0}
#hdr .prog{flex:1;display:flex;align-items:center;gap:.6rem;justify-content:center}
.dot{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-weight:900;border:.15rem solid var(--bd);background:rgba(255,255,255,.08);font-size:1rem}
.dot.done{background:var(--g);color:#06321b;border-color:#fff}.dot.cur{background:var(--y);color:#3b2a00;border-color:#fff;box-shadow:0 0 0 .25rem rgba(255,210,63,.35)}.dot.fin{border-color:var(--y);color:var(--y)}.dot.fin.done,.dot.fin.cur{color:#3b2a00}
.bar{height:.7rem;border-radius:1rem;background:rgba(255,255,255,.15);overflow:hidden;min-width:10rem}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));transition:width .5s}
#hdr .tools{display:flex;gap:.4rem}
.ib{min-width:2.8rem;height:2.8rem;border-radius:.8rem;border:1px solid var(--bd);background:rgba(255,255,255,.1);font-size:1.3rem;display:grid;place-items:center;padding:0 .6rem}.ib:hover{background:rgba(255,255,255,.22)}
#ftr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.2rem 1.2rem;background:rgba(5,8,30,.7);border-top:1px solid var(--bd);font-size:.95rem;flex-wrap:wrap}
#ftr b{color:var(--y)}
.cc-badge{display:inline-flex;align-items:center;gap:.5rem;color:#fff;text-decoration:none;font-weight:700}.cc-icons{display:inline-flex;gap:.2rem}.cc-icons svg{display:block}
/* botones */
.btn{border:0;border-radius:3rem;padding:.65em 1.4em;font-weight:900;font-size:1.2rem;background:rgba(255,255,255,.16);border:2px solid var(--bd);transition:transform .12s,filter .12s;min-height:2.8rem;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#ffe36e,#ff9f1c);color:#3b2000;border-color:#fff;box-shadow:0 .4rem 0 #b45309,0 .8rem 1.4rem rgba(0,0,0,.35);text-shadow:none}
.btn.go{background:linear-gradient(180deg,#5cf59a,#16a34a);border-color:#fff;box-shadow:0 .3rem 0 #0b5d2a,0 .7rem 1.2rem rgba(0,0,0,.3)}
.btn.dan{background:linear-gradient(180deg,#ff6b81,#dc2626);border-color:#fff}
.btn.big{font-size:2rem;padding:.6em 1.6em}.btn.sm{font-size:.95rem;padding:.4em .9em;min-height:2.4rem}.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}.center{justify-content:center;text-align:center}.sp{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1rem 1.2rem;backdrop-filter:blur(4px)}
.grid{display:grid;gap:.9rem}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.scr{animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both;max-width:120rem;margin:0 auto}
@keyframes enter{from{opacity:0;transform:translateY(1.5rem) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes glow{0%,100%{box-shadow:0 0 .6rem var(--y)}50%{box-shadow:0 0 2rem var(--y)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7rem)}}
.pageh{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem}.pageh h1{font-size:2.6rem}
.lead{font-size:1.4rem;opacity:.92}
/* portada */
.cover{display:grid;grid-template-columns:1.05fr 1fr;gap:1.2rem;align-items:center;min-height:100%}
.logo{display:flex;align-items:center;gap:1rem}
.wm{font-size:5.4rem;line-height:.9;color:#fff;text-shadow:0 .1em 0 #ff3d81,0 .2em 0 #7c3aed,0 .3em .5em rgba(0,0,0,.5)}
.wm small{display:block;font-size:2.4rem;color:var(--y);text-shadow:0 .08em 0 #b45309}
.sub{font-size:1.7rem;font-style:italic;color:var(--c);margin:.2rem 0 .6rem}
.author{display:inline-flex;align-items:center;gap:.8rem;background:linear-gradient(90deg,rgba(255,210,63,.25),rgba(255,61,129,.25));border:2px solid var(--y);border-radius:3rem;padding:.35rem 1.1rem;font-size:1.25rem}
.author b{color:var(--y);letter-spacing:.06em}
.cover-scene{width:100%;height:auto;max-height:32vh}
.mochila{margin-top:.8rem;border:2px dashed var(--y);border-radius:1.4rem;padding:.7rem 1rem;background:rgba(0,0,0,.25);cursor:pointer}
.mochila h3{font-size:1.15rem;color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chip{font-size:1.7rem;background:rgba(255,255,255,.12);border-radius:.8rem;padding:.1rem .45rem;title:x}
.cvbtns{display:flex;flex-wrap:wrap;gap:.7rem;margin:.8rem 0}
.mascot{filter:drop-shadow(0 .5rem .6rem rgba(0,0,0,.5));animation:float 3s ease-in-out infinite}
/* equipos */
.ncard{border:3px solid var(--bd);border-radius:1.6rem;background:var(--card);padding:1.2rem;text-align:center;transition:.15s;cursor:pointer}
.ncard:hover{transform:translateY(-.4rem);border-color:var(--y)}.ncard .num{font-size:6rem;line-height:1}.ncard .ppl{font-size:2rem}
.tcard{position:relative;border:4px solid var(--bd);border-radius:1.2rem;background:rgba(255,255,255,.08);padding:.7rem;text-align:center;cursor:pointer;transition:.15s;color:#fff}
.tcard:hover{transform:translateY(-.25rem)}.tcard .crest{display:block;margin:0 auto}.tcard b{display:block;font-size:1.05rem;margin-top:.3rem}.tcard small{opacity:.85;font-size:.8rem;display:block;line-height:1.15}
.tcard.sel{border-color:var(--tc);box-shadow:0 0 1.6rem var(--tc),inset 0 0 1.4rem rgba(255,255,255,.15);background:rgba(255,255,255,.2);animation:pop .5s}
.tcard.off{opacity:.35;pointer-events:none}
.tcard .tag{position:absolute;top:-.7rem;right:-.5rem;background:var(--y);color:#3b2000;border-radius:2rem;padding:.1rem .7rem;font-weight:900;font-size:.95rem}
.slot{display:flex;align-items:center;gap:.7rem;padding:.5rem .8rem;border-radius:1rem;background:rgba(0,0,0,.25);border:2px dashed var(--bd);font-size:1.25rem;min-width:15rem}
.slot.fill{border-style:solid;border-color:var(--tc)}
/* selección */
.opt{border:3px solid var(--bd);border-radius:1.4rem;padding:1rem 1.2rem;background:var(--card);cursor:pointer;transition:.15s;text-align:left;color:#fff;display:block;width:100%}
.opt:hover{transform:translateY(-.2rem);border-color:#fff}.opt.sel{border-color:var(--y);background:rgba(255,210,63,.18);box-shadow:0 0 1.2rem rgba(255,210,63,.5)}.opt h3{font-size:1.5rem}.opt p{margin:.3rem 0 0;font-size:1.05rem;opacity:.9}.opt .big{font-size:2.6rem}
.chal{display:flex;gap:.6rem;align-items:center;padding:.5rem .7rem;border-radius:1rem;border:2px solid var(--bd);background:rgba(255,255,255,.07);cursor:pointer;text-align:left;color:#fff;border-left:.5rem solid var(--cc)}
.chal.sel{background:rgba(255,210,63,.22);border-color:var(--y);border-left-color:var(--cc)}.chal .ic{font-size:1.8rem}.chal b{display:block;font-size:1rem;line-height:1.1}.chal small{opacity:.8}
/* intro del reto */
.intro{position:relative;border-radius:1.8rem;padding:1.2rem 1.6rem;background:linear-gradient(135deg,var(--c1),var(--c2));border:3px solid rgba(255,255,255,.5);box-shadow:0 1rem 3rem rgba(0,0,0,.4);overflow:hidden}
.intro::before{content:attr(data-ic);position:absolute;right:-1rem;bottom:-2.5rem;font-size:15rem;opacity:.12;transform:rotate(-12deg)}
.intro h1{font-size:3.4rem}.catb{display:inline-block;background:rgba(0,0,0,.35);border-radius:2rem;padding:.2rem .9rem;font-size:1.1rem;font-weight:800}
.intro .what{font-size:1.55rem;margin:.4rem 0 .8rem}
.how{list-style:none;padding:0;margin:0;counter-reset:s}.how li{counter-increment:s;display:flex;gap:.7rem;margin:.5rem 0;font-size:1.3rem;line-height:1.25;align-items:flex-start}.how li::before{content:counter(s);flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--y);color:#3b2000;font-weight:900;display:grid;place-items:center;font-size:1.1rem;margin-top:.1rem}
.anim{width:100%;height:auto;background:rgba(0,0,0,.28);border-radius:1.2rem;border:2px solid rgba(255,255,255,.3)}
.matrow{display:flex;gap:.5rem;flex-wrap:wrap}.mat{background:rgba(0,0,0,.28);border-radius:.9rem;padding:.25rem .7rem;font-size:1.1rem;display:flex;align-items:center;gap:.4rem}.mat i{font-style:normal;font-size:1.6rem}
.kv{background:rgba(0,0,0,.25);border-radius:1rem;padding:.5rem .9rem;margin:.5rem 0;font-size:1.15rem}.kv b{color:var(--y)}
.timeedit{display:inline-flex;align-items:center;gap:.4rem;background:rgba(0,0,0,.3);border-radius:2rem;padding:.2rem .5rem;font-weight:900;font-size:1.4rem}
.final{background:linear-gradient(135deg,#7a1d00,#a8001f 45%,#3b0a69);border-color:var(--y);animation:glow 2s infinite}
.final h1{color:var(--y);text-shadow:0 .08em 0 #7a1d00}
.badge2{display:inline-block;background:var(--y);color:#7a1d00;font-weight:900;border-radius:2rem;padding:.15rem .9rem;transform:rotate(-3deg);animation:pulse 1.4s infinite}
/* juego */
.play{display:grid;grid-template-columns:1fr 22rem;gap:1rem;height:100%}
.playmain{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.timerbox{display:flex;align-items:center;gap:1.2rem;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:1.5rem;padding:.6rem 1.2rem;border:3px solid rgba(255,255,255,.5)}
.timerbox h2{font-size:2rem;flex:1}
.clock{font-family:"Courier New",monospace;font-weight:900;font-size:5.6rem;line-height:1;text-shadow:0 .05em .2em rgba(0,0,0,.5);min-width:7.5rem;text-align:center}
.clock.low{color:#ff5a5f;animation:pulse .5s infinite}.clock.end{color:var(--y);animation:shake .4s 3}
.tbar{height:.8rem;background:rgba(0,0,0,.35);border-radius:1rem;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y),#ff5a5f);transition:width .3s linear}
.tool{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,.28);border:2px solid var(--bd);border-radius:1.4rem;padding:1rem 1.2rem}
.tally{display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center;background:rgba(255,255,255,.09);border-left:.45rem solid var(--tc);border-radius:1rem;padding:.4rem .6rem}
.trow .nm{font-weight:900;font-size:.95rem;line-height:1.05}.trow .sc{font-size:2.3rem;font-weight:900;min-width:2.6rem;text-align:right}
.trow .incs{grid-column:1/-1;display:flex;gap:.3rem;flex-wrap:wrap}.trow .incs button{flex:1;border:0;border-radius:.7rem;background:var(--tc);color:#fff;font-weight:900;padding:.35rem .4rem;font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.5);min-width:2.6rem}.trow .incs button.m{background:rgba(255,255,255,.2)}
.bigtext{font-size:3.6rem;font-weight:900;text-align:center;line-height:1.1}.mid{font-size:2.2rem;font-weight:800;text-align:center}
.cmdbox{border-radius:2rem;padding:1.5rem;text-align:center;min-height:15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;animation:pop .35s}
.cmdbox .e{font-size:7rem;line-height:1}.cmdbox .t{font-size:3.2rem;font-weight:900;line-height:1.1}
.optA{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}.optA div{border-radius:1rem;padding:.8rem 1rem;font-size:1.7rem;font-weight:800;border:3px solid rgba(255,255,255,.4);display:flex;gap:.7rem;align-items:center}.optA div b{width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.optA .ok{background:var(--g);color:#06321b;animation:pulse .6s 2;border-color:#fff}.optA .no{opacity:.35}
.qtxt{font-size:2.4rem;font-weight:900;line-height:1.15}
.cell{display:grid;place-items:center;border-radius:.8rem;background:rgba(255,255,255,.12);aspect-ratio:1;font-size:3rem}
.seqrow{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}.seqit{width:5rem;height:5rem;border-radius:1rem;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:3rem}
.lvl{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}.lvl button{border:2px solid var(--bd);background:rgba(255,255,255,.1);border-radius:2rem;padding:.2rem .8rem;font-weight:800}.lvl button.on{background:var(--y);color:#3b2000}
.art{font-size:3rem;line-height:1.15;text-align:center;white-space:pre}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,30,.88)}
.countnum{font-size:18rem;font-weight:900;font-family:Impact,sans-serif;color:var(--y);text-shadow:0 .05em 0 #b45309,0 0 4rem var(--p);animation:pop .8s}
.modal{width:min(86rem,94vw);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1a1450,#0b1033);border:3px solid var(--y);border-radius:1.6rem;padding:1.2rem 1.6rem;box-shadow:0 2rem 6rem #000;animation:enter .35s both}
.modal h2{font-size:2rem;color:var(--y)}.modal p,.modal li{font-size:1.2rem;line-height:1.35}
.toast{position:fixed;bottom:4rem;left:50%;transform:translateX(-50%);background:var(--y);color:#3b2000;padding:.6rem 1.4rem;border-radius:2rem;font-weight:900;font-size:1.2rem;z-index:80;animation:enter .3s both}
/* tablas */
table.t{width:100%;border-collapse:separate;border-spacing:0 .4rem;font-size:1.4rem}
table.t th{font-size:.95rem;text-align:center;opacity:.85;padding:.2rem .4rem;text-transform:uppercase;letter-spacing:.05em}
table.t td{background:rgba(255,255,255,.1);padding:.45rem .7rem;text-align:center;font-weight:800}
table.t td:first-child{border-radius:1rem 0 0 1rem}table.t td:last-child{border-radius:0 1rem 1rem 0}
table.t td.l{text-align:left}table.t tr.lead td{background:linear-gradient(90deg,rgba(255,210,63,.38),rgba(255,210,63,.14));box-shadow:0 0 1.2rem rgba(255,210,63,.4)}
table.t .pt{font-size:1.9rem;color:var(--y)}.tn{display:flex;align-items:center;gap:.6rem}
.pos{font-size:2rem;font-weight:900}
.rankrow{display:grid;grid-template-columns:20rem 1fr 14rem;gap:.8rem;align-items:center;background:rgba(255,255,255,.09);border-left:.5rem solid var(--tc);border-radius:1.1rem;padding:.3rem .8rem;margin:.3rem 0}
.posb{display:flex;gap:.4rem;flex-wrap:wrap}.posb button{width:4.2rem;height:3.6rem;border-radius:1rem;border:3px solid var(--bd);background:rgba(255,255,255,.1);font-weight:900;font-size:1.4rem}.posb button.on{background:var(--y);color:#3b2000;border-color:#fff;transform:scale(1.1)}
.msg{padding:.5rem 1rem;border-radius:1rem;font-weight:800;margin:.4rem 0}.msg.w{background:rgba(255,159,28,.25);border:2px solid var(--o)}.msg.e{background:rgba(255,61,129,.25);border:2px solid var(--p)}.msg.k{background:rgba(52,224,127,.2);border:2px solid var(--g)}
/* ceremonia */
.cer{display:flex;flex-direction:column;align-items:center;gap:.5rem;min-height:100%;position:relative}
.cer h1{font-size:3.4rem;text-align:center;color:var(--y);text-shadow:0 .07em 0 #b45309}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.6rem;height:29rem;margin-top:.2rem}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:21rem}
.pcol .who{min-height:11rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;font-weight:900}
.pcol .who>div{animation:pop .9s both}.pcol .who span{display:block;font-size:1.25rem}.pcol .who .crest{margin:0 .2rem}
.ped{width:100%;border-radius:1rem 1rem 0 0;display:grid;place-items:center;font-size:5rem;font-weight:900;font-family:Impact,sans-serif;color:rgba(0,0,0,.4);position:relative}
.ped.g{height:13rem;background:linear-gradient(180deg,#ffe27a,#d89b00)}.ped.s{height:9.5rem;background:linear-gradient(180deg,#e9eef5,#8a97a8)}.ped.b{height:7rem;background:linear-gradient(180deg,#f0b27a,#a05a1c)}
.champ{animation:pop 1.2s both,glow 1.5s 1.2s infinite;border-radius:1.5rem;padding:.4rem 1rem;background:rgba(255,210,63,.25)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.breathe{width:14rem;height:14rem;border-radius:50%;background:radial-gradient(circle,#8fe3ff,#2563eb);margin:1rem auto;animation:breathe 12s ease-in-out infinite;display:grid;place-items:center;font-size:1.6rem;font-weight:900}
@keyframes breathe{0%,100%{transform:scale(.6)}33%{transform:scale(1.2)}50%{transform:scale(1.2)}}
.sw{position:relative;width:30rem;height:30rem;margin:0 auto}
.small{font-size:.95rem;opacity:.85}
#printArea{display:none}
@media (max-width:1000px){.cover>div,.play>div{min-width:0}.wm{font-size:2.3rem!important;word-break:break-word}.btn.big{font-size:1.3rem}.logo svg{width:64px;height:64px}.cover,.play{grid-template-columns:1fr}.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.wm{font-size:3.4rem}.rankrow{grid-template-columns:1fr}.clock{font-size:3.6rem}body{overflow:auto}#app{height:auto;min-height:100vh}}

/* Tizón */
.tzw{position:fixed;bottom:3rem;z-index:65;display:flex;align-items:flex-end;gap:.2rem;max-width:min(44rem,92vw);cursor:pointer}
.tzL{left:1rem}.tzR{right:1rem;flex-direction:row-reverse}
.tzm{flex:none;filter:drop-shadow(0 .4rem .5rem rgba(0,0,0,.5))}
.tzb{background:#fff;color:#1b1340;border-radius:1.2rem;padding:.7rem 1rem;font-size:1.25rem;font-weight:700;line-height:1.25;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.5);position:relative;margin-bottom:3rem}
.tzb b{color:#7c3aed}
.tzL .tzb::before{content:"";position:absolute;left:-.7rem;bottom:1rem;border:.5rem solid transparent;border-right-color:#fff;border-left:0}
.tzR .tzb::before{content:"";position:absolute;right:-.7rem;bottom:1rem;border:.5rem solid transparent;border-left-color:#fff;border-right:0}
.tzin.tzL{animation:tzInL .7s cubic-bezier(.2,1.4,.4,1)}.tzin.tzR{animation:tzInR .7s cubic-bezier(.2,1.4,.4,1)}
.tzup{animation:tzUp .7s cubic-bezier(.2,1.6,.4,1)}.tzspin .tzm{animation:tzSpin .9s ease-out}.tzspin{animation:tzUp .5s}
.tzout{opacity:0;transform:translateY(2rem);transition:.5s}
@keyframes tzInL{from{transform:translateX(-120%)}to{transform:none}}@keyframes tzInR{from{transform:translateX(120%)}to{transform:none}}
@keyframes tzUp{from{transform:translateY(130%) scale(.8)}to{transform:none}}@keyframes tzSpin{from{transform:rotate(-360deg) scale(.2)}to{transform:none}}

 return `<line x1="${px}" y1="${py}" x2="${px}" y2="${py+len}" stroke="${col}" stroke-width="5" stroke-linecap="round" transform="rotate(${s*a0} ${px} ${py})">${an}</line>`;
}

 const mv=o.dy?`<animateTransform attributeName="transform" type="translate" values="0 0;0 ${o.dy};0 0" dur="${d}s" repeatCount="indefinite"/>`:'';
 return `<g>${mv}<circle cx="${x}" cy="${y-11}" r="9" fill="${col}"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y+28}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>`+
 limb(x,y+5,20,'l',la[0],la[1],d,col,o.b)+limb(x,y+5,20,'r',ra[0],ra[1],d,col,o.b)+limb(x,y+28,26,'l',ll[0],ll[1],d,col,o.b)+limb(x,y+28,26,'r',rl[0],rl[1],d,col,o.b)+`</g>`;
}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.random()*n|0, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const CHB=Object.fromEntries(CH.map(c=>[c.id,c]));
const PTS=[10,7,5,3,2,1], PTSF=[20,15,11,8,5,3], MEDAL=['🥇','🥈','🥉','🎖️','🎖️','🎖️'], MED_KEY=['g','s','b','d','d','d'];
const KEY='aulaolimpiadas.v1';
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const defS=()=>({v:1,screen:'cover',cfg:{n:0,mat:'full',mode:'express',sel:'auto',pace:1},teams:[],plan:[],cur:0,res:{},adj:{},tally:{},usedQ:[],play:null,editing:null,started:false});
let S=defS(), UI={sound:true,anim:!reduced,font:1,music:true,vol:.3,track:-1,tizon:true};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveUI(){try{localStorage.setItem(KEY+'.ui',JSON.stringify(UI))}catch(e){}}
function load(){
 try{const u=JSON.parse(localStorage.getItem(KEY+'.ui'));if(u)UI=Object.assign(UI,u)}catch(e){}
 try{const j=JSON.parse(localStorage.getItem(KEY));
  if(j&&j.v===1){const s=Object.assign(defS(),j);
   const ok=(s.teams||[]).every(t=>TEAMBY[t.k])&&(s.plan||[]).every(p=>CHB[p.id]);
   if(ok)S=s;}
 }catch(e){}
}
const inMode=(c,mat)=>mat==='zero'?(c.m==='z'||c.m==='b'):true;
const poolN=()=>CH.filter(c=>!c.fin&&inMode(c,S.cfg.mat));
const poolF=()=>CH.filter(c=>c.fin&&inMode(c,S.cfg.mat));
const nPlan=()=>S.cfg.mode==='express'?3:5;
const defT=c=>clamp(Math.round(c.t*S.cfg.pace/30)*30,60,900);
function autoPick(k,exclude=[]){
 const pool=shuffle(poolN().filter(c=>!exclude.includes(c.id)));const out=[],used=new Set();
 for(const c of pool){if(out.length>=k)break;if(!used.has(c.cat)){out.push(c);used.add(c.cat)}}
 for(const c of pool){if(out.length>=k)break;if(!out.includes(c))out.push(c)}
 return out;
}
function mkPlan(ids){S.plan=ids.map(id=>({id,t:defT(CHB[id])}));S.cur=0;S.res={};S.adj={};S.tally={};S.rt={};S.qz={};S.tlog={};S.usedQ=[];S.usedQE=[];S.play=null;S.editing=null;S.started=false}

/* ---------- puntuación ---------- */
function totals(){
 const T={};S.teams.forEach(t=>T[t.k]={k:t.k,pts:0,g:0,s:0,b:0,d:0,fair:0,adj:S.adj[t.k]||0});
 Object.entries(S.res).forEach(([i,r])=>{
  if(!r||r.skip||!S.plan[i])return;const tb=CHB[S.plan[i].id].fin?PTSF:PTS;
  for(const k in r.pos){const p=r.pos[k];if(!T[k]||!(p>=1&&p<=6))continue;T[k].pts+=tb[p-1];T[k][MED_KEY[p-1]]++}
  for(const k in (r.fair||{}))if(r.fair[k]&&T[k]){T[k].fair++;T[k].pts++}
 });
 Object.values(T).forEach(t=>t.pts+=t.adj);return T;
}
function standings(){
 const L=Object.values(totals()).sort((a,b)=>b.pts-a.pts||b.g-a.g||b.s-a.s||b.b-a.b);const G=[];
 L.forEach(t=>{const g=G[G.length-1];if(g&&g.t[0].pts===t.pts&&g.t[0].g===t.g&&g.t[0].s===t.s&&g.t[0].b===t.b)g.t.push(t);else G.push({pos:G.length+1,t:[t]})});
 return G;
}
function normPos(pos){const v=[...new Set(Object.values(pos))].sort((a,b)=>a-b);const m={};v.forEach((x,i)=>m[x]=i+1);const o={};for(const k in pos)o[k]=m[pos[k]];return o}
function suggestPos(tal){
 const ks=S.teams.map(t=>t.k);const vals=[...new Set(ks.map(k=>tal[k]||0))].sort((a,b)=>b-a);const o={};
 ks.forEach(k=>o[k]=vals.indexOf(tal[k]||0)+1);return o;
}

let AC=null;
function ac(){if(!UI.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d=.15,type='sine',v=.2,when=0){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const SFX={
 tick:()=>tone(880,.08,'square',.08),pop:()=>tone(520,.09,'triangle',.18),bad:()=>tone(160,.3,'sawtooth',.15),
 go:()=>{tone(523,.15,'square',.15);tone(784,.35,'square',.15,.16)},
 ok:()=>{tone(660,.1,'triangle',.22);tone(990,.22,'triangle',.22,.1)},
 end:()=>{[0,.22,.44].forEach(w=>tone(330,.18,'sawtooth',.18,w));tone(660,.6,'sawtooth',.18,.7)},
 drum:()=>{tone(70,.22,'sine',.6);tone(70,.22,'sine',.6,.26)},
 reveal:()=>{tone(392,.15,'square',.14);tone(523,.15,'square',.14,.15);tone(659,.3,'square',.14,.3)},
 fan:()=>{[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'square',.12,i*.17));[262,330,392,523].forEach((f,i)=>tone(f,.5,'triangle',.18,1.4+i*.05))}
};

const CF={p:[],run:false};
function confetti(n=170){
 if(!UI.anim)return;const cv=$('#confetti');if(!cv)return;cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#ffd23f','#ff3d81','#19d3ff','#34e07f','#ff9f1c','#a78bfa','#fff'];
 for(let i=0;i<n;i++)CF.p.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*5,vy:2+Math.random()*5,r:5+Math.random()*7,c:cols[rnd(cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4});
 if(!CF.run){CF.run=true;requestAnimationFrame(cfStep)}
}
function cfStep(){
 const cv=$('#confetti');if(!cv){CF.run=false;return}const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
 CF.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.vy+=.03;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);x.restore()});
 CF.p=CF.p.filter(p=>p.y<cv.height+30);
 if(CF.p.length)requestAnimationFrame(cfStep);else{CF.run=false;x.clearRect(0,0,cv.width,cv.height)}
}

<div class="grid g2" style="margin-top:.9rem"><div class="card"><h3>🏅 Puntos por prueba</h3><table class="t"><thead><tr><th>Puesto</th><th>Normal</th><th>Gran final</th><th>Premio</th></tr></thead><tbody>${PTS.map((p,i)=>`<tr><td class="pos">${i+1}.º</td><td class="pt">${p}</td><td class="pt">${PTSF[i]}</td><td style="font-size:1.6rem">${['🥇 Oro','🥈 Plata','🥉 Bronce','🎖️ Diploma','🎖️ Diploma','🎖️ Diploma'][i]}</td></tr>`).join('')}</tbody></table></div>
<div class="card"><h3>⚖️ Empates y desempate</h3><p class="lead" style="font-size:1.2rem">Si dos equipos quedan en el mismo puesto, reciben los mismos puntos y la misma medalla. El siguiente puesto es el siguiente número (1.º, 1.º, 2.º…).</p><p class="lead" style="font-size:1.2rem">Si hay empate final en puntos, se mira quién tiene más oros, después platas y después bronces. Si persiste, ¡se comparte el puesto!</p><p class="lead" style="font-size:1.2rem">⭐ <b>Juego Limpio:</b> el profe puede dar 1 punto extra al equipo que mejor coopere, respete y anime.</p><h3 style="margin-top:.8rem">⌨️ Atajos</h3><p class="small">Espacio = iniciar/pausar · → continuar · ← volver · F = pantalla completa</p></div></div>
<div class="row" style="margin-top:.9rem"><button class="btn pri big" data-a="start" data-primary>¡Vamos a jugar!</button></div></div>`;

/* ============ MATERIALES ============ */
let UI_MT='plan';
SCR.materials=()=>{
 const tabs=[['plan','Mi competición'],['full','Full Experience (todo el banco)'],['zero','Zero Material']];
 if(!S.plan.length&&UI_MT==='plan')UI_MT='full';
 const ids=UI_MT==='plan'?S.plan.map(p=>p.id):UI_MT==='full'?CH.map(c=>c.id):CH.filter(c=>c.m==='z'||c.m==='b').map(c=>c.id);
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="home" data-back>← Atrás</button><h1 class="disp">🎒 Nuestra mochila de retos</h1></div>
 <div class="row" style="margin-bottom:.8rem">${tabs.filter(t=>t[0]!=='plan'||S.plan.length).map(([k,l])=>`<button class="btn ${UI_MT===k?'pri':''}" data-a="mtTab" data-v="${k}">${l}</button>`).join('')}</div>${matListHTML(ids,'Materiales necesarios')}</div>`;
};
ACT.mtTab=v=>{UI_MT=v;render()};

/* ============ BANCO DE RETOS ============ */
const BF={cat:'all',q:''};
function bankList(){
 const q=BF.q.trim().toLowerCase();
 const L=CH.filter(c=>(BF.cat==='all'||c.cat===BF.cat)&&(!q||(c.n+' '+c.w).toLowerCase().includes(q)));
 return `<div class="grid g4">${L.map(c=>`<button class="chal" style="--cc:${CATS[c.cat][2]}" data-a="bankOpen" data-v="${c.id}"><span class="ic">${c.ic}</span><div><b>${esc(c.n)}</b><small>${c.m==='z'?'Zero material':c.m==='b'?'Con o sin material':'Con material'}${c.fin?' · FINAL':''} · ${fmt(c.t)}</small></div></button>`).join('')||'<p class="lead">No hay retos con ese filtro.</p>'}</div>`;
}
SCR.bank=()=>`<div class="scr"><div class="pageh"><button class="btn sm" data-a="home" data-back>← Portada</button><h1 class="disp">🎯 Banco de retos</h1><span class="lead">${CH.filter(c=>!c.fin).length} retos + ${CH.filter(c=>c.fin).length} finales · ${QS.length+QSEF.length} preguntas de trivial</span></div>
<div class="row" style="margin-bottom:.7rem"><button class="btn sm ${BF.cat==='all'?'pri':''}" data-a="bankCat" data-v="all">Todos</button>${Object.entries(CATS).map(([k,v])=>`<button class="btn sm ${BF.cat===k?'pri':''}" data-a="bankCat" data-v="${k}">${v[1]} ${v[0]}</button>`).join('')}<input data-i="bankq" value="${esc(BF.q)}" placeholder="🔎 Buscar reto…" aria-label="Buscar reto" style="font-size:1.1rem;padding:.4rem .9rem;border-radius:2rem;border:2px solid var(--bd);background:rgba(0,0,0,.3);color:#fff"></div>
<div id="bl">${bankList()}</div></div>`;
ACT.bankCat=v=>{BF.cat=v;render()};
INP.bankq=v=>{BF.q=v;$('#bl').innerHTML=bankList()};
ACT.bankOpen=id=>{const c=CHB[id];modal(introCard(c,{prev:true})+`<div class="row" style="margin-top:.8rem"><button class="btn pri" data-a="close">Cerrar</button></div>`,true)};

/* ============ EQUIPOS ============ */
SCR.nteams=()=>`<div class="scr"><div class="pageh"><button class="btn sm" data-a="home" data-back>← Atrás</button><h1 class="disp">¿Cuántos equipos juegan?</h1></div><p class="lead">Elige entre 1 y 6 equipos. Con un solo equipo la clase compite en cooperativo contra el reloj.</p>
<div class="grid g3" style="margin-top:1rem">${[1,2,3,4,5,6].map(n=>`<button class="ncard" data-a="setN" data-v="${n}"><div class="num disp" style="color:var(--y)">${n}</div><div class="ppl">${'👥'.repeat(Math.min(n,3))}${n>3?'+':''}</div><b style="font-size:1.4rem">${n===1?'1 equipo':n+' equipos'}</b></button>`).join('')}</div></div>`;
ACT.setN=v=>{S.cfg.n=+v;S.teams=S.teams.slice(0,S.cfg.n);S.plan=[];S.res={};go('names')};
const UTI={};
SCR.names=()=>{
 const n=S.cfg.n,chosen=S.teams.map(t=>t.k);
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="back_n" data-back>← Atrás</button><h1 class="disp">Elegid vuestro equipo</h1></div>
 <p class="lead">Toca un escudo para asignarlo al siguiente equipo libre. Toca otra vez para quitarlo.</p>
 <div class="row" style="margin:.6rem 0">${Array.from({length:n},(_,i)=>{const t=S.teams[i];return t?`<button class="slot fill" style="--tc:${TEAMBY[t.k].c}" data-a="unpick" data-v="${t.k}">${crest(t.k,40)}<b>${i+1}. ${TEAMBY[t.k].n}</b></button>`:`<div class="slot">⬜ <span>Equipo ${i+1}: elige un escudo</span></div>`}).join('')}</div>
 <div class="grid g5">${TEAMS.map(t=>{const sel=chosen.includes(t.k);const full=!sel&&chosen.length>=n;return `<button class="tcard ${sel?'sel':''} ${full?'off':''}" style="--tc:${t.c}" data-a="pick" data-v="${t.k}" ${full?'disabled':''}>${sel?`<span class="tag">Equipo ${chosen.indexOf(t.k)+1}</span>`:''}${crest(t.k,92)}<b style="color:${t.c};filter:brightness(1.6)">${t.n}</b><small>“${t.m}”</small></button>`}).join('')}</div>
 <div class="row" style="margin-top:1rem"><button class="btn" data-a="randTeams">🎲 Completar al azar</button><div class="sp"></div><button class="btn pri big" data-a="toConfig" data-primary ${chosen.length===n?'':'disabled'}>Continuar →</button></div></div>`;
};
ACT.back_n=()=>go('nteams');
ACT.pick=k=>{const i=S.teams.findIndex(t=>t.k===k);if(i>=0)S.teams.splice(i,1);else if(S.teams.length<S.cfg.n){S.teams.push({k});SFX.pop()}save();render()};
ACT.unpick=k=>ACT.pick(k);
ACT.randTeams=()=>{const free=shuffle(TEAMS.map(t=>t.k).filter(k=>!S.teams.some(t=>t.k===k)));while(S.teams.length<S.cfg.n)S.teams.push({k:free.pop()});save();render()};
ACT.toConfig=()=>go('config');

/* ============ CONFIGURACIÓN ============ */
SCR.config=()=>{
 const C=S.cfg;
 const o=(a,v,cur,h,p,ic)=>`<button class="opt ${cur===v?'sel':''}" data-a="${a}" data-v="${v}"><div class="big">${ic}</div><h3>${h}</h3><p>${p}</p></button>`;
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="names_back" data-back>← Atrás</button><h1 class="disp">Configura la competición</h1></div>
 <h2>1 · Modalidad de material</h2><div class="grid g2">${o('cMat','full',C.mat,'OLIMPIADAS FULL EXPERIENCE','Retos con material deportivo, cotidiano y reciclado (vasos, pelotas de espuma, chapas…).','🎒')}${o('cMat','zero',C.mat,'OLIMPIADAS ZERO MATERIAL','Batería propia de juegos que no necesitan preparar nada. ¡Solo cuerpo y mente!','✨')}</div>
 <h2 style="margin-top:.8rem">2 · Duración</h2><div class="grid g2">${o('cMode','express',C.mode,'MODO EXPRESS · 3 pruebas','2 retos + el Gran Reto Final. Ideal para una sesión corta.','⚡')}${o('cMode','full',C.mode,'OLIMPIADAS COMPLETAS · 5 pruebas','4 retos + el Gran Reto Final. La competición completa.','🏆')}</div>
 <h2 style="margin-top:.8rem">3 · Selección de retos</h2><div class="grid g2">${o('cSel','auto',C.sel,'AL AZAR','Variedad automática de categorías, sin repetir.','🎲')}${o('cSel','manual',C.sel,'ELEGIR YO','Tú decides qué pruebas jugamos.','🖐️')}</div>
 <h2 style="margin-top:.8rem">4 · Ritmo</h2><div class="row">${[[.75,'⏩ Rápido (−25 %)'],[1,'⏱️ Normal'],[1.25,'🐢 Tranquilo (+25 %)']].map(([v,l])=>`<button class="btn ${C.pace===v?'pri':''}" data-a="cPace" data-v="${v}">${l}</button>`).join('')}<span class="small">Después puedes ajustar el tiempo de cada reto.</span></div>
 <div class="row" style="margin-top:1rem"><div class="sp"></div><button class="btn pri big" data-a="mkComp" data-primary>${C.sel==='auto'?'Crear competición →':'Elegir retos →'}</button></div></div>`;
};
ACT.names_back=()=>go('names');
ACT.cMat=v=>{S.cfg.mat=v;save();render()};ACT.cMode=v=>{S.cfg.mode=v;save();render()};ACT.cSel=v=>{S.cfg.sel=v;save();render()};ACT.cPace=v=>{S.cfg.pace=+v;save();render()};
let SEL={n:[],f:null};
ACT.mkComp=()=>{
 if(S.cfg.sel==='auto'){const n=nPlan();const ids=autoPick(n-1).map(c=>c.id);ids.push(shuffle(poolF())[0].id);mkPlan(ids);go('plan')}
 else{SEL={n:[],f:null};go('select')}
};

/* ============ SELECCIÓN MANUAL ============ */
SCR.select=()=>{
 const k=nPlan()-1,P=poolN(),F=poolF();
 const cats=Object.keys(CATS).filter(x=>x!=='X'&&P.some(y=>y.cat===x));
 const ok=SEL.n.length===k&&SEL.f;
 const falta=SEL.n.length<k?`Faltan ${k-SEL.n.length} retos normales`:!SEL.f?'Falta elegir el GRAN RETO FINAL (arriba)':'';
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="cfg_back" data-back>← Atrás</button><h1 class="disp">Elige tus ${k+1} pruebas</h1><span class="lead">${k} retos + el Gran Reto Final = ${k+1} pruebas</span></div>
 <div class="card" style="border-color:var(--y);margin-bottom:.5rem"><h3 style="color:var(--y)">🔥 1.º Elige el GRAN RETO FINAL (será la prueba ${k+1}) ${SEL.f?'✅':'⬅ ¡no te olvides!'}</h3><div class="grid g5">${F.map(x=>`<button class="chal ${SEL.f===x.id?'sel':''}" style="--cc:#ffd700" data-a="selF" data-v="${x.id}"><span class="ic">${x.ic}</span><div><b>${esc(x.n)}</b><small>${fmt(x.t)}${SEL.f===x.id?' · ✓':''}</small></div></button>`).join('')}</div></div>
 <h3 style="margin:.3rem 0">2.º Elige ${k} retos normales · <span style="color:var(--y)">${SEL.n.length}/${k}</span></h3>
 ${cats.map(x=>`<div style="color:${CATS[x][2]};font-weight:900;margin-top:.3rem">${CATS[x][1]} ${CATS[x][0]}</div><div class="grid g5">${P.filter(y=>y.cat===x).map(y=>`<button class="chal ${SEL.n.includes(y.id)?'sel':''}" style="--cc:${CATS[x][2]}" data-a="selN" data-v="${y.id}"><span class="ic">${y.ic}</span><div><b>${esc(y.n)}</b><small>${y.tm==='no'?'por turnos':y.tm==='rt'?'turnos por equipo':fmt(y.t)}${SEL.n.includes(y.id)?' · ✓':''}</small></div></button>`).join('')}</div>`).join('')}
 <div class="row" style="margin:.8rem 0"><button class="btn" data-a="selRand">🎲 Completar al azar</button><button class="btn" data-a="selClear">Limpiar</button><div class="sp"></div>${falta?`<span class="msg w">${falta}</span>`:''}<button class="btn pri big" data-a="selOk" data-primary ${ok?'':'disabled'}>Ver el plan →</button></div></div>`;
};
ACT.cfg_back=()=>go('config');
ACT.selN=id=>{const i=SEL.n.indexOf(id);if(i>=0)SEL.n.splice(i,1);else if(SEL.n.length<nPlan()-1)SEL.n.push(id);else toast('Ya tienes los '+(nPlan()-1)+' retos normales: la última prueba es el Gran Reto Final (arriba). Quita alguno para cambiar.',3500);keepScroll()};
ACT.selF=id=>{SEL.f=SEL.f===id?null:id;keepScroll()};
ACT.selRand=()=>{const k=nPlan()-1;const add=autoPick(k-SEL.n.length,SEL.n).map(c=>c.id);SEL.n.push(...add);if(!SEL.f)SEL.f=shuffle(poolF())[0].id;keepScroll()};
ACT.selClear=()=>{SEL={n:[],f:null};keepScroll()};
ACT.selOk=()=>{mkPlan([...SEL.n,SEL.f]);go('plan')};
function keepScroll(){const m=$('#main'),y=m.scrollTop;$('#main').innerHTML=SCR[S.screen]();fit();m.scrollTop=y;applyAnimState()}

/* ============ PLAN ============ */
SCR.plan=()=>{
 const last=S.plan.length-1;
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="plan_back" data-back>← Atrás</button><h1 class="disp">Plan de la competición</h1></div>
 <p class="lead">${S.teams.length} ${S.teams.length===1?'equipo':'equipos'} · ${S.cfg.mat==='full'?'Full Experience':'Zero Material'} · ${S.plan.length} pruebas. Puedes cambiar el tiempo, el orden o cualquier reto.</p>
 <div style="margin:.7rem 0">${S.plan.map((p,i)=>{const c=CHB[p.id];return `<div class="rankrow" style="--tc:${c.fin?'#ffd700':CATS[c.cat][2]};grid-template-columns:5rem 1fr auto auto"><div style="font-size:3rem;text-align:center">${c.ic}</div><div><b style="font-size:1.5rem">${i+1}. ${esc(c.n)}</b>${c.fin?' <span class="badge2">GRAN FINAL</span>':''}<div class="small">${CATS[c.cat][1]} ${CATS[c.cat][0]} · ${c.mat.length?c.mat.map(m=>MATS[m][0]).join(' '):'✅ sin material'}</div></div>
 ${c.tm==='rt'?`<span class="catb">🔁 ${c.tml||'Turnos de '+fmt(toolO(c).secs)+' por equipo'}</span>`:c.tm==='no'?'<span class="catb">🔁 Por turnos · sin reloj</span>':`<div class="timeedit"><button class="btn sm" data-a="pT" data-v="${i}:-30" aria-label="Menos tiempo">−</button>${fmt(p.t)}<button class="btn sm" data-a="pT" data-v="${i}:30" aria-label="Más tiempo">+</button></div>`}
 <div class="row"><button class="btn sm" data-a="pChange" data-v="${i}">🔀 Cambiar</button>${!c.fin&&i>0?`<button class="btn sm" data-a="pMove" data-v="${i}:-1" aria-label="Subir">⬆️</button>`:''}${!c.fin&&i<last-1?`<button class="btn sm" data-a="pMove" data-v="${i}:1" aria-label="Bajar">⬇️</button>`:''}</div></div>`}).join('')}</div>
 <div class="row"><button class="btn" data-a="matModal">🎒 Ver materiales de toda la competición</button><button class="btn" data-a="mkComp">🎲 Otro plan al azar</button><div class="sp"></div><button class="btn pri big" data-a="beginComp" data-primary>¡Presentar equipos! →</button></div></div>`;
};
ACT.plan_back=()=>go('config');
ACT.pT=v=>{const [i,d]=v.split(':').map(Number);S.plan[i].t=clamp(S.plan[i].t+d,30,900);save();if(S.screen==='plan')keepScroll();else if(S.screen==='intro')render()};
ACT.pMove=v=>{const [i,d]=v.split(':').map(Number);const j=i+d;[S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];save();keepScroll()};
ACT.pChange=v=>{
 const i=+v,cur=CHB[S.plan[i].id];const taken=S.plan.map(p=>p.id);
 const L=(cur.fin?poolF():poolN()).filter(c=>!taken.includes(c.id));
 modal(`<h2>🔀 Cambiar “${esc(cur.n)}”</h2><div class="grid g3">${L.map(c=>`<button class="chal" style="--cc:${CATS[c.cat][2]}" data-a="pDo" data-v="${i}:${c.id}"><span class="ic">${c.ic}</span><div><b>${esc(c.n)}</b><small>${CATS[c.cat][0]} · ${fmt(c.t)}</small></div></button>`).join('')}</div><div class="row" style="margin-top:.8rem"><button class="btn" data-a="pRand" data-v="${i}">🎲 Uno al azar</button><button class="btn pri" data-a="close">Cancelar</button></div>`,true);
};
ACT.pRand=v=>{const i=+v,cur=CHB[S.plan[i].id];const L=(cur.fin?poolF():poolN()).filter(c=>!S.plan.some(p=>p.id===c.id));if(L.length)ACT.pDo(i+':'+L[rnd(L.length)].id);else toast('No quedan más retos para cambiar.')};
ACT.pDo=v=>{const [i,id]=v.split(':');S.plan[i]={id,t:defT(CHB[id])};delete S.tally[i];if(S.rt)delete S.rt[i];if(S.qz)delete S.qz[i];if(S.tlog)delete S.tlog[i];save();closeModal();S.screen==='plan'?keepScroll():render()};
ACT.beginComp=()=>{S.started=true;S.cur=0;save();go('presenta')};

/* ============ PRESENTACIÓN DE EQUIPOS ============ */

<div class="grid" style="grid-template-columns:repeat(${Math.min(S.teams.length,3)},1fr);margin:1rem 0">${S.teams.map((t,i)=>{const T=TEAMBY[t.k];return `<div class="tcard sel" style="--tc:${T.c};animation-delay:${i*.7}s;cursor:default" data-pres="${i}"><span class="tag">Equipo ${i+1}</span>${crest(t.k,S.teams.length>3?110:140)}<b style="font-size:1.8rem">${T.n}</b><small style="font-size:1.2rem">“${T.m}”</small></div>`}).join('')}</div>
<div class="row center"><button class="btn" data-a="plan_back2" data-back>← Plan</button><button class="btn pri big" data-a="goIntro" data-primary>¡Primera prueba! →</button></div></div>`;
AFTER.presenta=()=>{SFX.reveal();$$('[data-pres]').forEach(el=>{const i=+el.dataset.pres;setTimeout(()=>SFX.pop(),i*700)});confetti(60)};
ACT.plan_back2=()=>go('plan');
ACT.goIntro=()=>{openIntro(S.cur)};
function openIntro(i){S.cur=i;S.play=null;S._last='intro';go('intro')}

const BG={iv:null,idx:-1,step:0,next:0,gain:null,hold:false,noise:null};
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
const dfreq=(T,d)=>{const n=T.sc.length,i=((d%n)+n)%n,o=Math.floor(d/n);return T.root*Math.pow(2,(T.sc[i]+12*o)/12)};
function bgNote(f,t,d,type,v){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(BG.gain);o.start(t);o.stop(t+d+.05)}
function bgNoise(t,d,v,hp,bp){const a=AC;if(!BG.noise){const b=a.createBuffer(1,a.sampleRate*.5,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;BG.noise=b}
 const s=a.createBufferSource();s.buffer=BG.noise;const f=a.createBiquadFilter();f.type=bp?'bandpass':'highpass';f.frequency.value=bp||hp;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(BG.gain);s.start(t);s.stop(t+d+.02)}
function bgStep(T,st,t,sd){
 const l=T.lead[st];if(l!==undefined&&l!==R_)bgNote(dfreq(T,l),t,sd*T.ld,T.lw,T.lv);
 const s16=st%16;
 if(T.pad&&s16===0){T.pad[Math.floor(st/16)%T.pad.length].forEach(d=>bgNote(dfreq(T,d),t,sd*15,'sine',.07))}
 const b=T.bass[s16];if(b!==undefined&&b!==R_)bgNote(dfreq(T,b)/4,t,sd*(T.pad?14:1.8),T.bw,T.bv);
 if(T.k.includes(s16)){const a=AC,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(BG.gain);o.start(t);o.stop(t+.2)}
 if(T.h.includes(s16))bgNoise(t,.04,.09,7000);
 if(T.s.includes(s16))bgNoise(t,.12,.22,0,1800);
}
function bgSched(){const a=AC,T=TRACKS[BG.idx];if(!a||!T)return;const sd=60/T.bpm/4;while(BG.next<a.currentTime+.3){bgStep(T,BG.step,BG.next,sd);BG.next+=sd;BG.step=(BG.step+1)%32}}
function bgVol(){return BG.gain?(UI.vol*(BG.duck||1)):0}
function bgStop(){
 clearInterval(BG.iv);BG.iv=null;const g=BG.gain;BG.idx=-1;
 if(g&&AC){try{g.gain.setTargetAtTime(0,AC.currentTime,.08)}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},500)}
 BG.gain=null;
}
function bgStart(i){
 if(!UI.music||BG.hold)return;const a=actx();if(!a)return;
 if(BG.idx===i&&BG.iv)return;
 bgStop();BG.idx=i;BG.step=0;BG.next=a.currentTime+.1;
 BG.gain=a.createGain();BG.gain.gain.value=0;BG.gain.connect(a.destination);
 BG.gain.gain.setTargetAtTime(UI.vol*(BG.duck||1),a.currentTime,.4);
 BG.iv=setInterval(bgSched,40);
}
function bgAuto(){
 if(!UI.music||BG.hold||document.hidden)return;
 const sc=S.screen;let i=0,duck=1;
 if(UI.track>=0)i=UI.track;
 else if(sc==='intro'||sc==='play'){const c=S.plan[S.cur]&&CHB[S.plan[S.cur].id];i=c&&c.fin?4:[1,2,0][S.cur%3];if(sc==='play')duck=.55}
 else if(sc==='rank'||sc==='standings')i=3;
 else if(sc==='ceremony'||sc==='summary')i=0;
 BG.duck=(UI.track>=0&&sc==='play')?.55:duck;
 if(BG.idx!==i||!BG.iv)bgStart(i);else if(BG.gain&&AC)BG.gain.gain.setTargetAtTime(UI.vol*BG.duck,AC.currentTime,.3);
}
function bgHold(v){BG.hold=v;if(v)bgStop();else bgAuto()}

let TZT=0,TZE=null,TZH=null;
function tzFill(s){
 const G=doneCount()?standings():null;
 const names=G?G[0].t.map(t=>TEAMBY[t.k].n).join(' y '):'quien más puntos tenga';
 const last=G?G[G.length-1].t.map(t=>TEAMBY[t.k].n).join(' y '):'los demás equipos';
 return s.replace(/\{lider\}/g,names).replace(/\{ultimo\}/g,last);
}
function tzPick(cat){
 S.tz=S.tz||{used:[]};const L=TZ[cat];if(!L)return null;
 let idx=L.map((_,i)=>i).filter(i=>!S.tz.used.includes(cat+':'+i));
 if(!idx.length){S.tz.used=S.tz.used.filter(u=>!u.startsWith(cat+':'));idx=L.map((_,i)=>i)}
 const i=idx[rnd(idx.length)];S.tz.used.push(cat+':'+i);save();return tzFill(L[i]);
}
function tizon(cat,force){
 if(!UI.tizon)return;const now=Date.now();if(!force&&now-TZT<18000)return;

 const anims=['tzin','tzup','tzspin'],side=(S.tz.n=(S.tz.n||0)+1)%2?'tzL':'tzR',an=anims[rnd(anims.length)];

 e.addEventListener('click',()=>{e.remove();TZE=null});document.body.appendChild(e);TZE=e;applyAnimState();
 TZH=setTimeout(()=>{if(TZE===e){e.classList.add('tzout');setTimeout(()=>{e.remove();if(TZE===e)TZE=null},500)}},Math.min(9000,3500+txt.length*55));
}

 modal(`<h2>${P.e} ${P.n}</h2><div class="center">${resp?`<div id="pzOrb" style="width:16rem;height:16rem;border-radius:50%;margin:1.2rem auto;background:radial-gradient(circle,#8fe3ff,#2563eb);transform:scale(.6);display:grid;place-items:center;font-size:3rem">${P.e}</div>`:`<div id="pzVis" style="max-width:34rem;margin:.5rem auto"></div>`}<div class="bigtext" id="pzTxt" style="font-size:2.4rem;min-height:5.5rem"></div><div class="clock" id="pzN" style="font-size:5rem">0</div><div class="tbar" style="margin:.5rem 0"><i id="pzP" style="width:0%"></i></div><div class="small" id="pzS"></div></div><div class="row center" style="margin-top:.5rem"><button class="btn pri" data-a="close">Terminar</button></div>`);
 const setStep=()=>{
  const s=steps[si];left=dur(s);$('#pzTxt').textContent=txt(s);$('#pzN').textContent=left;$('#pzS').textContent=`Paso ${si+1} de ${steps.length}`;
  if(resp){const o=$('#pzOrb');o.style.transition=`transform ${s[0]==='hold'?.2:left}s ease-in-out`;if(s[0]==='in')o.style.transform='scale(1.3)';else if(s[0]==='out')o.style.transform='scale(.6)';tone(s[0]==='in'?392:s[0]==='out'?262:330,.4,'sine',.18)}
  else{$('#pzVis').innerHTML=animSVG(s[2]);applyAnimState();tone(440+si%3*90,.3,'sine',.18)}
 };
 clearInterval(PZ.iv);window.onModalClose=()=>clearInterval(PZ.iv);
 setStep();
 PZ.iv=setInterval(()=>{
  if(!MODAL){clearInterval(PZ.iv);return}
  left--;el++;const n=$('#pzN'),pr=$('#pzP');if(n)n.textContent=Math.max(0,left);if(pr)pr.style.width=(el/tot*100)+'%';
  if(left<=0){si++;if(si>=steps.length){clearInterval(PZ.iv);SFX.ok();$('#pzTxt').textContent='¡Muy bien! Ya estamos más tranquilos 🌟';$('#pzN').textContent='✔';$('#pzS').textContent='';return}setStep()}
 },1000);
};
ACT.warm=()=>ACT.pausa('act');
ACT.calm=()=>ACT.pausa('resp');

/* ============ CEREMONIA ============ */
let CER={k:0};
SCR.ceremony=()=>{
 const G=standings(),m=Math.min(3,G.length),ties1=G[0].t.length>1;
 const cols=[2,1,3].filter(p=>p<=m);
 const revealed=p=>(m-p)<CER.k;
 const nextP=m-CER.k;
 const colH=p=>{
  const g=G[p-1];const sz=g.t.length>3?56:g.t.length>1?80:120;
  const who=revealed(p)?`<div class="${p===1?'champ':''}">${g.t.map(t=>`<span style="display:inline-block">${crest(t.k,sz)}</span>`).join('')}<span>${g.t.map(t=>TEAMBY[t.k].n).join(' y ')}</span><span style="color:var(--y);font-size:1.6rem">${g.t[0].pts} pts</span></div>`:'';
  return `<div class="pcol"><div class="who">${who}</div><div class="ped ${['','g','s','b'][p]}">${p}</div></div>`;
 };
 const done=CER.k>=m;
 return `<div class="scr cer"><h1 class="disp">${CER.k===0?'¡HA TERMINADO LA COMPETICIÓN!':done?(ties1?'¡EMPATE EN LO MÁS ALTO!':'¡TENEMOS CAMPEÓN!'):'¡Y el puesto '+(nextP+1)+'.º es para…!'}</h1>
 <div class="podium">${cols.map(colH).join('')}</div>
 ${done?`<div class="mid" style="color:var(--y)">${ties1?'🏆 Campeones compartidos: ':'🏆 Campeón: '}${G[0].t.map(t=>TEAMBY[t.k].n).join(' y ')}${G[0].t.length>1?'<br><span class="lead">Mismos puntos y mismas medallas: ¡el puesto se comparte!</span>':''}</div>`:''}
 <div class="row center" style="margin-top:.6rem">${done?`<button class="btn" data-a="cerAll" data-primary>📊 Clasificación final completa</button>`:`<button class="btn pri big" data-a="cerNext" data-primary>${CER.k===0?'¡Revelar resultados!':`Revelar el ${nextP}.º puesto`}</button><button class="btn sm" data-a="cerSkip">Mostrar todo ya</button>`}<button class="btn sm" data-a="stBack2" data-back>← Clasificación</button></div></div>`;
};
ACT.stBack2=()=>go('standings');
ACT.cerNext=()=>{
 const G=standings(),m=Math.min(3,G.length);
 const reveal=()=>{CER.k++;tizon('ceremonia',true);const p=m-CER.k+1;if(p===1){SFX.fan();confetti(260);setTimeout(()=>confetti(160),1200);setTimeout(()=>confetti(160),2400)}else SFX.reveal();render()};
 if(CER.k===0){cdown(3,false,reveal)}else reveal();
};
ACT.cerSkip=()=>{const G=standings();CER.k=Math.min(3,G.length);SFX.fan();confetti(200);render()};
ACT.cerAll=()=>go('summary');

/* ============ RESUMEN FINAL ============ */
const REFL=['¿Qué reto te ha gustado más y por qué?','¿Cómo ha colaborado tu equipo para conseguir los puntos?','¿Qué hemos hecho hoy para jugar limpio?','¿Qué reto te ha costado más? ¿Cómo podrías mejorarlo?','¿Qué has aprendido de otro equipo?','¿Qué cambiaríamos si volviéramos a jugar?','¿Cómo te has sentido cuando perdías un punto? ¿Y cuando ganabas?'];
let RF=[0,1,2];
SCR.summary=()=>{
 const G=standings();
 return `<div class="scr"><div class="pageh"><button class="btn sm" data-a="toCer2" data-back>← Ceremonia</button><h1 class="disp">📊 Clasificación final</h1></div>
 <div class="grid" style="grid-template-columns:1.2fr 1fr;gap:1rem"><div>${stTable(G,{sz:48})}</div><div>
 <div class="card"><h3>🏅 Resultados por prueba</h3><table class="t" style="font-size:1rem"><thead><tr><th style="text-align:left">Prueba</th>${S.teams.map(t=>`<th>${crest(t.k,22)}</th>`).join('')}</tr></thead><tbody>${S.plan.map((p,i)=>{const r=S.res[i];return `<tr><td class="l">${CHB[p.id].ic} ${esc(CHB[p.id].n)}</td>${S.teams.map(t=>`<td>${r&&!r.skip&&r.pos[t.k]?MEDAL[r.pos[t.k]-1]+(r.fair&&r.fair[t.k]?'⭐':''):'–'}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>
 <div class="card" style="margin-top:.6rem"><h3>💭 Rueda de reflexión</h3>${RF.map(i=>`<p class="lead" style="font-size:1.2rem;margin:.3rem 0">• ${REFL[i]}</p>`).join('')}<button class="btn sm" data-a="rfNew">🔄 Otras preguntas</button></div></div></div>
 <div class="row" style="margin-top:.8rem"><button class="btn" data-a="stModalBack">📈 Ver medallero</button><button class="btn" data-a="csv">⬇️ Descargar resultados (CSV)</button><button class="btn" data-a="prn">🖨️ Imprimir</button><button class="btn" data-a="calm">🌬️ Vuelta a la calma</button><div class="sp"></div><button class="btn pri big" data-a="newComp2" data-primary>🔄 Nueva competición</button></div></div>`;
};
ACT.toCer2=()=>{CER={k:Math.min(3,standings().length)};go('ceremony')};
ACT.stModalBack=()=>ACT.stModal();
ACT.rfNew=()=>{RF=shuffle(REFL.map((_,i)=>i)).slice(0,3);render()};
ACT.newComp2=()=>ACT.newComp();
ACT.csv=()=>{
 const G=standings();const rows=[['Posición','Equipo','Puntos','Oros','Platas','Bronces','Diplomas','Juego limpio',...S.plan.map((p,i)=>`${i+1}. ${CHB[p.id].n}`)]];
 G.forEach(g=>g.t.forEach(t=>rows.push([g.pos,TEAMBY[t.k].n,t.pts,t.g,t.s,t.b,t.d,t.fair,...S.plan.map((p,i)=>{const r=S.res[i];return r&&!r.skip&&r.pos[t.k]?r.pos[t.k]:''})])));
 rows.push([]);rows.push(['AulaOlimpiadas · Diseñado por David OZC · David 2026 · CC BY-NC-ND 4.0 · Uso gratuito en centros educativos']);
 const txt='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='aulaolimpiadas-resultados.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('No se pudo descargar el archivo')}
};
ACT.prn=()=>{
 const G=standings(),d=new Date().toLocaleDateString('es-ES');
 $('#printArea').innerHTML=`<h1>AULAOLIMPIADAS: El Gran Desafío</h1><p>Fecha: ${d} · ${S.teams.length} equipo(s) · ${S.cfg.mat==='full'?'Full Experience':'Zero Material'}</p>
 <table><thead><tr><th>Pos.</th><th>Equipo</th><th>Puntos</th><th>Oro</th><th>Plata</th><th>Bronce</th><th>Diplomas</th><th>Juego limpio</th></tr></thead><tbody>${G.map(g=>g.t.map(t=>`<tr><td>${g.pos}</td><td>${TEAMBY[t.k].n}</td><td>${t.pts}</td><td>${t.g}</td><td>${t.s}</td><td>${t.b}</td><td>${t.d}</td><td>${t.fair}</td></tr>`).join('')).join('')}</tbody></table>
 <table><thead><tr><th>Prueba</th>${S.teams.map(t=>`<th>${TEAMBY[t.k].n}</th>`).join('')}</tr></thead><tbody>${S.plan.map((p,i)=>{const r=S.res[i];return `<tr><td style="text-align:left">${i+1}. ${esc(CHB[p.id].n)}</td>${S.teams.map(t=>`<td>${r&&!r.skip&&r.pos[t.k]?r.pos[t.k]+'.º':'–'}</td>`).join('')}</tr>`}).join('')}</tbody></table>
 <p>Observaciones del profesorado: ______________________________________________________________</p>
 <p class="cc">© 2026 David OZC · Obra bajo licencia Creative Commons Reconocimiento-NoComercial-SinObraDerivada 4.0 Internacional (CC BY-NC-ND 4.0) · Uso gratuito en centros educativos.</p>`;
 setTimeout(()=>window.print(),100);
};

/* ============ ARRANQUE ============ */
function boot(){
 load();
 const app=document.getElementById('app');
 app.innerHTML=`<header id="hdr"></header><main id="main" tabindex="-1"></main><footer id="ftr"></footer>`;
 renderFtr();
 if(!SCR[S.screen])S.screen='cover';
 if(S.screen==='play'){plInit()}
 render();
}
window.addEventListener('beforeunload',()=>{try{if(PL.run)tStop();save()}catch(e){}});
document.addEventListener('DOMContentLoaded',boot);
window.AO={drawTool:()=>drawTool(),get S(){return S},ACT,SCR,go,render,totals,standings,CHB,CH,QS,TL,get TS(){return TS},PL,mkPlan,get RK(){return RK},set RK(v){RK=v},get CER(){return CER}};


</script>
